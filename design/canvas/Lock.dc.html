<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autark lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#68625A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #24221E; background: #F6F4EF">
  <div style="position: absolute; inset: 0; filter: blur(14px); transform: scale(1.04)">
    <dc-import name="Wallpaper" hint-size="1440px,900px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(246, 244, 239, 0.35)"></div>

  <div style="position: absolute; top: 120px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 20px; font-weight: 500; color: #24221E">Friday, 16 October</span>
    <span style="font-size: 120px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">14:32</span>
  </div>

  <form aria-label="Unlock" style="position: absolute; bottom: 140px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <span aria-hidden="true" style="width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #3F7A5F; color: #FFFFFF; font-size: 30px; font-weight: 600">T</span>
    <span style="font-size: 16px; font-weight: 600">tan</span>
    <label style="display: flex; align-items: center; gap: 8px; width: 260px; height: 40px; padding: 0 6px 0 16px; box-sizing: border-box; border-radius: 20px; background: rgba(36, 34, 30, 0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(36, 34, 30, 0.16)">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</span>
      <input type="password" placeholder="Password" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #24221E; font: inherit; font-size: 14px">
      <button type="submit" aria-label="Unlock" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(36, 34, 30, 0.18); color: #24221E">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6l-6 6"></path></svg>
      </button>
    </label>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3E3A34">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 11v4M8.5 8.5a5 5 0 0 1 8.5 3.5v2M7 12a5 5 0 0 0 .4 2M12 4a8 8 0 0 1 8 8v1M4 12a8 8 0 0 1 3-6.2"></path></svg>
      Touch the fingerprint sensor or type your password
    </span>
  </form>

  <div style="position: absolute; bottom: 28px; right: 32px; display: flex; gap: 10px">
    <button aria-label="Restart" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(36, 34, 30, 0.12); color: #24221E">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>
    </button>
    <button aria-label="Shut down" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(36, 34, 30, 0.12); color: #24221E">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
