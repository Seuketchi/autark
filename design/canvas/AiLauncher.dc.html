<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autark AI launcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#7A736A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #24221E; background: #F6F4EF">
  <div style="position: absolute; inset: 0">
    <dc-import name="Wallpaper" hint-size="1440px,900px"></dc-import>
  </div>
  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5">
    <dc-import name="TopBar" app="Files" hint-size="1440px,32px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(246, 244, 239, 0.40)"></div>

  <div role="dialog" aria-label="AI launcher" style="position: absolute; left: 360px; top: 104px; width: 720px; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.86); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%); border: 1px solid rgba(36, 34, 30, 0.10); border-radius: 18px; box-shadow: 0 30px 80px rgba(70, 58, 40, 0.18); overflow: hidden">
    <label style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 20px; border-bottom: 1px solid rgba(36, 34, 30, 0.08)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F7A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask Kith</span>
      <input type="text" value="{{query}}" onInput="{{onQuery}}" placeholder="Ask Kith, or tell it to do something" style="flex: 1; height: 40px; border: none; outline: none; background: transparent; color: #24221E; font: inherit; font-size: 18px">
      <span style="padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(36, 34, 30, 0.14); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #68625A">esc</span>
    </label>

    <section aria-label="Actions" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 6px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7A736A">ACTIONS</span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: {{routeBg}}; color: {{routeFg}}">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{routeDot}}"></span>{{routeLabel}}
        </span>
      </div>
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 12px; background: {{a.rowBg}}; border: 1px solid rgba(36, 34, 30, 0.08)">
          <button role="checkbox" aria-checked="{{a.checked}}" aria-label="{{a.ariaLabel}}" onClick="{{a.toggle}}" style="width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 6px; border: 1.5px solid {{a.boxBorder}}; background: {{a.boxBg}}; color: #FFFFFF">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.tick}}"></path></svg>
          </button>
          <span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #E1EDE6; color: #336650">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
            <span style="font-size: 14px; font-weight: 500">{{a.title}} <span style="color: #336650; font-weight: 600">→ {{a.value}}</span></span>
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #7A736A">{{a.call}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 92px">
            <span style="font-size: 11px; color: #68625A">confidence {{a.confText}}</span>
            <span aria-hidden="true" style="width: 92px; height: 4px; border-radius: 2px; background: rgba(36, 34, 30, 0.10); overflow: hidden"><span style="display: block; height: 100%; width: {{a.confPct}}%; background: #3F7A5F"></span></span>
          </span>
          <sc-if value="{{a.done}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; font-weight: 600; color: #336650">Done</span>
          </sc-if>
        </div>
      </sc-for>
      <div style="display: flex; justify-content: flex-end; padding: 4px 0 6px">
        <button onClick="{{run}}" disabled="{{runDisabled}}" style="height: 34px; padding: 0 16px; border: none; border-radius: 9px; background: {{runBg}}; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">{{runLabel}}</button>
      </div>
    </section>

    <section aria-label="Answer" style="display: flex; flex-direction: column; gap: 10px; margin: 0 16px 16px; padding: 16px; border-radius: 14px; background: #FBFAF7; border: 1px solid rgba(36, 34, 30, 0.08)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7A736A">ANSWER</span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #E1EDE6; color: #336650">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"></path></svg>
          Ollama · on this laptop
        </span>
      </div>
      <p aria-live="polite" style="margin: 0; min-height: 72px; font-size: 14px; line-height: 1.6; color: #24221E">{{answer}}<sc-if value="{{streaming}}" hint-placeholder-val="{{true}}"><span style="display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: #3F7A5F"></span></sc-if></p>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <span style="display: flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; background: rgba(36, 34, 30, 0.06); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #68625A">read ~/autark/log.md</span>
        <div style="flex: 1"></div>
        <sc-if value="{{streaming}}" hint-placeholder-val="{{true}}">
          <button onClick="{{stop}}" style="height: 30px; padding: 0 12px; border: none; border-radius: 8px; background: rgba(36, 34, 30, 0.07); color: #24221E; font: inherit; font-size: 12px">Stop</button>
        </sc-if>
        <button style="height: 30px; padding: 0 12px; border: none; border-radius: 8px; background: rgba(36, 34, 30, 0.07); color: #24221E; font: inherit; font-size: 12px">Open log.md</button>
      </div>
    </section>

    <footer style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid rgba(36, 34, 30, 0.08); font-size: 12px; color: #68625A">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9c-4.6-.8-8-4.5-8-9V6z"></path></svg>
      <span style="flex: 1">{{privacy}}</span>
      <span>Use Jev for the launcher</span>
      <button role="switch" aria-checked="{{jevChecked}}" aria-label="Use Jev for the launcher" onClick="{{toggleJev}}" style="width: 40px; height: 24px; padding: 2px; border: none; border-radius: 12px; display: flex; justify-content: {{jevJustify}}; background: {{jevTrack}}">
        <span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(70, 58, 40, 0.3)"></span>
      </button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      query: 'dim the screen and mute, then tell me why my last build stopped',
      jev: true,
      checked: { brightness: true, volume: true },
      ran: false,
      words: 0,
      stopped: false
    };
    this.text = 'Your last build stopped in Step 5, during the GCC test suite. The failures in log.md all appear on the book’s list of known failures, so the toolchain is fine and you can continue with the next package.';
  }
  componentDidMount() {
    const total = this.text.split(' ').length;
    this.timer = setInterval(() => {
      if (this.state.stopped || this.state.words >= total) {
        clearInterval(this.timer);
        return;
      }
      this.setState({ words: this.state.words + 1 });
    }, 90);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const st = this.state;
    const words = this.text.split(' ');
    const streaming = !st.stopped && st.words < words.length;
    const defs = [
      { id: 'brightness', title: 'Display brightness', value: '30%', call: 'org.autark.Display.SetBrightness(0.30)', conf: 0.94, d: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' },
      { id: 'volume', title: 'Volume', value: 'muted', call: 'org.autark.Sound.SetMuted(true)', conf: 0.97, d: 'M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6' }
    ];
    const actions = defs.map((a) => {
      const on = st.checked[a.id];
      return {
        ...a,
        checked: on ? 'true' : 'false',
        ariaLabel: a.title + ' to ' + a.value,
        boxBg: on ? '#3F7A5F' : 'transparent',
        boxBorder: on ? '#3F7A5F' : 'rgba(36, 34, 30, 0.30)',
        tick: on ? 'M5 12l4.5 4.5L19 7' : 'M0 0',
        rowBg: st.ran && on ? '#E1EDE6' : '#FFFFFF',
        confText: a.conf.toFixed(2),
        confPct: Math.round(a.conf * 100),
        done: st.ran && on,
        toggle: () => this.setState({ checked: { ...st.checked, [a.id]: !on }, ran: false })
      };
    });
    const count = defs.filter((a) => st.checked[a.id]).length;
    return {
      query: st.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      actions,
      routeLabel: st.jev ? 'Jev · cloud · about 150 ms' : 'Ollama · on this laptop · a few seconds',
      routeBg: st.jev ? 'rgba(61, 99, 232, 0.10)' : '#E1EDE6',
      routeFg: st.jev ? '#2F50C7' : '#336650',
      routeDot: st.jev ? '#3D63E8' : '#3F7A5F',
      run: () => this.setState({ ran: true }),
      runDisabled: count === 0 || st.ran,
      runBg: count === 0 || st.ran ? '#A7BFB2' : '#3F7A5F',
      runLabel: st.ran ? 'Ran ' + count + (count === 1 ? ' action' : ' actions') : 'Run ' + count + (count === 1 ? ' action' : ' actions') + '  ↵',
      answer: words.slice(0, st.words).join(' '),
      streaming,
      stop: () => this.setState({ stopped: true }),
      privacy: st.jev
        ? 'Jev picked the actions from your typed text only. The answer and your log stayed on this laptop.'
        : 'Local only: nothing left this laptop.',
      jevChecked: st.jev ? 'true' : 'false',
      jevJustify: st.jev ? 'flex-end' : 'flex-start',
      jevTrack: st.jev ? '#3F7A5F' : 'rgba(36, 34, 30, 0.18)',
      toggleJev: () => this.setState({ jev: !st.jev })
    };
  }
}
</script>
</body>
</html>
