<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autark notification centre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input[type=range]{accent-color:#3F7A5F}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #24221E; background: #F6F4EF">
  <div style="position: absolute; inset: 0">
    <dc-import name="Wallpaper" hint-size="1440px,900px"></dc-import>
  </div>
  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5">
    <dc-import name="TopBar" app="Terminal" hint-size="1440px,32px"></dc-import>
  </div>

  <aside aria-label="Notification centre" style="position: absolute; top: 44px; right: 12px; width: 380px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Quick settings" style="padding: 14px; display: flex; flex-direction: column; gap: 14px; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%); border: 1px solid rgba(36, 34, 30, 0.10); border-radius: 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
          <button aria-pressed="{{t.pressed}}" onClick="{{t.flip}}" style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; border: none; border-radius: 12px; text-align: left; font: inherit; background: {{t.bg}}; color: {{t.fg}}">
            <span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{t.iconBg}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column">
              <span style="font-size: 13px; font-weight: 600">{{t.label}}</span>
              <span style="font-size: 11px; color: {{t.sub}}">{{t.state}}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #68625A">Display brightness
        <input type="range" min="0" max="100" value="{{brightness}}" onInput="{{onBrightness}}" style="width: 100%">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #68625A">Volume
        <input type="range" min="0" max="100" value="{{volume}}" onInput="{{onVolume}}" style="width: 100%">
      </label>
    </section>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 0">
      <span style="font-size: 13px; font-weight: 600">Notifications</span>
      <button onClick="{{clear}}" style="height: 28px; padding: 0 10px; border: none; border-radius: 8px; background: rgba(36, 34, 30, 0.10); color: #24221E; font: inherit; font-size: 12px">Clear all</button>
    </div>

    <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
      <article style="display: flex; gap: 12px; padding: 14px; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%); border: 1px solid rgba(36, 34, 30, 0.10); border-radius: 16px">
        <span style="width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: {{n.tile}}; color: #FFFFFF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
        </span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #68625A"><span>{{n.app}}</span><span>{{n.when}}</span></div>
          <span style="font-size: 13px; font-weight: 600">{{n.title}}</span>
          <span style="font-size: 12px; line-height: 1.45; color: #3E3A34">{{n.body}}</span>
        </div>
      </article>
    </sc-for>
    <sc-if value="{{none}}" hint-placeholder-val="{{false}}">
      <div style="padding: 24px; text-align: center; font-size: 13px; color: #68625A">No notifications</div>
    </sc-if>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { wifi: true, bt: false, dnd: false, night: true }, brightness: 70, volume: 45, cleared: false };
  }
  renderVals() {
    const defs = [
      { id: 'wifi', label: 'Wi-Fi', onText: 'home-5G', d: 'M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01' },
      { id: 'bt', label: 'Bluetooth', onText: 'On', d: 'M7 7l10 10l-5 4V3l5 4L7 17' },
      { id: 'dnd', label: 'Focus', onText: 'Do not disturb', d: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' },
      { id: 'night', label: 'Night light', onText: 'Until 07:00', d: 'M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z' }
    ];
    const toggles = defs.map((t) => {
      const on = this.state.on[t.id];
      return {
        ...t,
        pressed: on ? 'true' : 'false',
        state: on ? t.onText : 'Off',
        bg: on ? '#3F7A5F' : 'rgba(36, 34, 30, 0.08)',
        fg: on ? '#FFFFFF' : '#24221E',
        sub: on ? '#E1EDE6' : '#68625A',
        iconBg: on ? 'rgba(20, 23, 28, 0.14)' : 'rgba(36, 34, 30, 0.10)',
        flip: () => this.setState({ on: { ...this.state.on, [t.id]: !on } })
      };
    });
    const notes = this.state.cleared ? [] : [
      { app: 'autark-build', when: 'now', title: 'Checkpoint: Step 4 done', body: 'Temporary tools built. backup-ch7.tar.xz written to ~/autark.', tile: '#336650', d: 'M5 12l5 5L20 7' },
      { app: 'fprintd', when: '12 min ago', title: 'Fingerprint enrolled', body: 'Right index finger saved. You can unlock with the sensor.', tile: '#3E6FB0', d: 'M12 11v4M8.5 8.5a5 5 0 0 1 8.5 3.5v2M7 12a5 5 0 0 0 .4 2M12 4a8 8 0 0 1 8 8v1M4 12a8 8 0 0 1 3-6.2' },
      { app: 'Power', when: '1 h ago', title: 'Charging', body: 'Battery at 87%, fully charged in about 40 minutes.', tile: '#596170', d: 'M13 3L5 13h6l-1 8l8-10h-6z' }
    ];
    return {
      toggles,
      notes,
      none: notes.length === 0,
      brightness: this.state.brightness,
      volume: this.state.volume,
      onBrightness: (e) => this.setState({ brightness: Number(e.target.value) }),
      onVolume: (e) => this.setState({ volume: Number(e.target.value) }),
      clear: () => this.setState({ cleared: true })
    };
  }
}
</script>
</body>
</html>
