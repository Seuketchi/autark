<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autark top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 1440px; height: 32px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: rgba(239, 236, 229, 0.55); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border-bottom: 1px solid rgba(36, 34, 30, 0.06); font-family: 'Geist', system-ui, sans-serif; font-size: 13px; color: #24221E">
  <button aria-label="Autark menu" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 26px; padding: 0; border: none; border-radius: 6px; background: transparent; color: #3F7A5F">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 19.5L12 4.5l6.5 15C14.5 16 9.5 16 5.5 19.5z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit; font-weight: 600">{{app}}</button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit">File</button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit">Edit</button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit">View</button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit">Window</button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit">Help</button>
  <div style="flex: 1"></div>
  <button aria-label="Wi-Fi: connected" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 26px; padding: 0; border: none; border-radius: 6px; background: transparent; color: #24221E">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"></path><circle cx="12" cy="19" r="1" fill="currentColor"></circle></svg>
  </button>
  <button aria-label="Volume" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 26px; padding: 0; border: none; border-radius: 6px; background: transparent; color: #24221E">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
  </button>
  <button aria-label="Battery 87 percent" style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit">
    <span>87%</span>
    <svg width="24" height="14" viewBox="0 0 26 14" fill="none" aria-hidden="true"><rect x="1" y="1" width="21" height="12" rx="3" stroke="currentColor" stroke-width="1.5"></rect><rect x="3" y="3" width="15" height="8" rx="1.5" fill="currentColor"></rect><path d="M24 5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
  </button>
  <button style="height: 26px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #24221E; font: inherit; font-variant-numeric: tabular-nums">Fri 16 Oct  14:32</button>
  <button aria-label="Notification centre" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 26px; padding: 0; border: none; border-radius: 6px; background: transparent; color: #24221E">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M14 4v16"></path></svg>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null,"default":"Terminal","tsType":"string"},"$preview":{"width":1440,"height":32}}'>
class Component extends DCLogic {
  renderVals() {
    return { app: this.props.app ?? 'Terminal' };
  }
}
</script>
</body>
</html>
